<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ailaa — Oynat</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#0A0B12;color:#ECEDF4;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
  .msg{font-family:ui-monospace,monospace;font-size:0.85rem;color:#8E90A8;text-align:center;padding:24px;}
  .mark{position:absolute;right:9px;bottom:9px;z-index:5;font-family:ui-monospace,monospace;font-size:0.68rem;
        color:#0A0B12;background:#F5A93B;padding:5px 10px;border-radius:100px;text-decoration:none;font-weight:700;
        box-shadow:0 4px 14px -4px rgba(0,0,0,0.6);opacity:.92;}
  .mark:hover{opacity:1;}

  /* ═══════ NEON TERMINAL KATMANI (arcade reskin) ═══════ */
  :root{
    --bg:#050308; --bg-raised:#0E0816; --bg-raised-2:#150C22;
    --line:#241338; --text:#F2EDFA; --text-muted:#9A8FB8;
    --mint:#21F0D6; --violet:#B44CFF; --amber:#FFB347; --coral:#FF2E88;
  }
  body{background:#050308 !important;}
  .arcfx-scan{position:fixed; inset:0; z-index:96; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; opacity:.5;}
  .arcfx-wash{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden;}
  .arcfx-wash::before,.arcfx-wash::after{content:""; position:absolute; border-radius:50%; filter:blur(110px); opacity:.34;}
  .arcfx-wash::before{width:60vw; height:60vw; top:-24vw; left:-16vw; background:radial-gradient(circle,rgba(255,46,136,.5),transparent 65%);}
  .arcfx-wash::after{width:56vw; height:56vw; top:10vw; right:-20vw; background:radial-gradient(circle,rgba(33,240,214,.45),transparent 65%);}
  .arcfx-vign{position:fixed; inset:0; z-index:95; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(0,0,0,.5) 100%);}
  h1, h2{text-transform:uppercase; letter-spacing:-.01em;}
  h1{color:#fff; text-shadow:0 0 10px rgba(255,46,136,.5), 0 0 34px rgba(255,46,136,.4);}
  @media (prefers-reduced-motion:reduce){ .arcfx-scan{display:none;} }

  /* ═══ ARCADE DERİN KATMAN ═══ */
  h1{font-family:'Space Grotesk',sans-serif !important; font-weight:700;}
  h2{font-family:'Space Grotesk',sans-serif !important;}
  button, .btn{font-family:'JetBrains Mono',monospace !important; letter-spacing:.06em; text-transform:uppercase;}
  input:focus, textarea:focus, select:focus{border-color:var(--mint) !important; box-shadow:0 0 14px rgba(33,240,214,.25);}
  ::selection{background:var(--coral); color:#14020b;}

  .mark{background:linear-gradient(180deg,#ffd9a0,var(--amber)) !important; box-shadow:0 0 18px rgba(255,179,71,.6), 0 4px 14px -4px #000 !important; font-weight:700;}

</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0B12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ailaa">
</head>
<body>
<div class="arcfx-wash"></div><div class="arcfx-scan"></div><div class="arcfx-vign"></div>
<div id="stage"><div class="msg" id="msg">yükleniyor…</div></div>
<a class="mark" id="mark" href="https://ailaa.io" target="_blank" rel="noopener">ailaa.io ↗</a>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var stage=document.getElementById("stage"), msg=document.getElementById("msg");
  function fail(t){ if(msg) msg.textContent=t; }
  var id=new URLSearchParams(location.search).get("p");
  var previewToken=new URLSearchParams(location.search).get("preview");
  if(!id){ fail("Proje belirtilmedi."); return; }

  var url=window.AILAA_SUPABASE_URL, key=window.AILAA_SUPABASE_KEY;
  if(!url || String(url).indexOf("BURAYA")>=0 || typeof supabase==="undefined"){ fail("Yapılandırma eksik."); return; }
  var db=supabase.createClient(url,key);

  db.from("projects").select("id,title,file_url,status,preview_token,bundle").eq("id", id).maybeSingle().then(function(r){
    var p=r && r.data;
    if(!p){ fail("Proje bulunamadı."); return; }
    var allowed = p.status==="approved" || (previewToken && p.preview_token && previewToken===p.preview_token);
    if(!allowed){ fail(p.status==="pending" ? "Bu proje henüz onay bekliyor. Erken erişim linkiyle açman gerekiyor." : "Bu proje yayında değil."); return; }
    document.title="Ailaa — "+(p.title||"Oynat");
    document.getElementById("mark").href="https://ailaa.io/store?p="+p.id;
    if(p.status==="approved"){ try{ db.rpc("increment_plays",{ pid: p.id }).then(function(){},function(){}); }catch(e){} }
    if(p.bundle){
      // çok dosyalı paket: göreli yollar çalışsın diye doğrudan src
      var bf=document.createElement("iframe");
      bf.setAttribute("sandbox","allow-scripts allow-pointer-lock");
      bf.setAttribute("allow","autoplay; fullscreen");
      bf.setAttribute("allowfullscreen","");
      bf.setAttribute("title", p.title||"oyun");
      bf.src=p.file_url;
      stage.innerHTML=""; stage.appendChild(bf);
      return;
    }
    fetch(p.file_url).then(function(res){ return res.text(); }).then(function(html){
      var f=document.createElement("iframe");
      f.setAttribute("sandbox","allow-scripts");
      f.setAttribute("allow","autoplay; fullscreen");
      f.setAttribute("allowfullscreen","");
      f.setAttribute("title", p.title||"oyun");
      f.srcdoc=html;
      stage.innerHTML=""; stage.appendChild(f);
    }).catch(function(){ fail("Proje yüklenemedi."); });
  }).catch(function(){ fail("Proje bulunamadı."); });
})();
</script>
</body>
</html>
