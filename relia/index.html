async function modApi(path, opts){
  const o = Object.assign({}, opts||{});
  o.headers = Object.assign({ apikey:CFG.key, 'Content-Type':'application/json',
    Authorization:'Bearer ' + (state.mod.token || CFG.key) }, o.headers||{});
  const res = await fetch(CFG.url + path, o);
  if (res.status === 401){ state.mod.token = null; renderMod(); throw new Error('401'); }
  if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0,160));
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
async function modAuth(kind, email, pass){
  const path = kind==='in' ? '/auth/v1/token?grant_type=password' : '/auth/v1/signup';
  const res = await fetch(CFG.url + path, { method:'POST',
    headers:{ apikey:CFG.key, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password: pass }) });
  const j = await res.json();
  if (!res.ok) throw new Error(j.msg || j.error_description || j.error || 'auth');
  return j;
}
async function modRefresh(){
  const m = state.mod;
  try{
    const out = await modApi('/rest/v1/rpc/rc_mod_stats', { method:'POST', body:'{}' });
    m.stats = Array.isArray(out) ? out[0] : out; m.isMod = true;
  }catch(e){
    m.isMod = false; m.stats = null;
    try{ const b = await modApi('/rest/v1/rpc/rc_needs_bootstrap', { method:'POST', body:'{}' });
      m.boot = (b === true || b === 'true'); }catch(e2){ m.boot = false; }
  }
  if (m.isMod){
    try{ const c = await modApi('/rest/v1/rpc/rc_get_code', { method:'POST', body:'{}' });
      m.code = typeof c === 'string' ? c : ''; }catch(e){}
    try{ m.team = await modApi('/rest/v1/rpc/rc_list_moderators', { method:'POST', body:'{}' }) || []; }catch(e){ m.team = []; }
    let q = '/rest/v1/rc_reports?select=*&order=abuse.desc,created_at.desc&limit=60';
    if (m.term) q += '&listing=eq.' + encodeURIComponent(m.term.replace(/[^0-9a-zA-Z]/g,''));
    else if (m.filter==='flagged') q += '&abuse=gte.1';
    else if (m.filter==='hidden')  q += '&hidden=is.true';
    try{ m.rows = await modApi(q) || []; }catch(e){ m.rows = []; }
  }
  renderMod();
}
async function modAct(kind, id){
  const r = state.mod.rows.find(x=>x.id===id); if(!r) return;
  try{
    if (kind==='toggle'){
      await modApi('/rest/v1/rc_reports?id=eq.'+id, { method:'PATCH', body: JSON.stringify({ hidden: !r.hidden }) });
      r.hidden = !r.hidden;
    }
    if (kind==='del'){
      if(!(await askConfirm(t('mdConfirmDel')))) return;
      await modApi('/rest/v1/rc_reports?id=eq.'+id, { method:'DELETE' });
      state.mod.rows = state.mod.rows.filter(x=>x.id!==id);
    }
    if (kind==='block'){
      if(!(await askConfirm(t('mdConfirmBlock')))) return;
      await modApi('/rest/v1/rc_blocked_devices', { method:'POST',
        body: JSON.stringify({ device:r.device, reason:'moderasyon' }) });
    }
    toast(t('mdDone')); renderMod();
  }catch(e){ toast(String(e.message).slice(0,60)); }
}

/* Yönetici işlevleri — hepsi sunucuda moderatör denetiminden geçer */
async function adminRpc(fn, body){
  const res = await fetch(CFG.url + '/rest/v1/rpc/' + fn, { method:'POST',
    headers:{ apikey:CFG.key, Authorization:'Bearer '+state.mod.token, 'Content-Type':'application/json' },
    body: JSON.stringify(body || {}) });
  const txt = await res.text();
  let out; try{ out = JSON.parse(txt); }catch(e){ out = txt; }
  if (!res.ok) throw new Error(String(txt).slice(0,140));
  return out;
}
function bindAdmin(){
  const box = $('admStats'); if (!box) return;
  adminRpc('rc_admin_stats').then(st=>{
    const cellA = (n,v,c)=>`<div style="border:2px solid var(--fg);padding:8px 4px">
      <p class="text-[17px] font-bold num" style="${c?'color:'+c:''}">${v==null?'—':v}</p>
      <p class="text-[9.5px] uppercase mt-0.5" style="color:var(--gray)">${n}</p></div>`;
    box.innerHTML =
      cellA(t('admUsers'), st.users) +
      cellA(t('admFounders'), st.founders, 'var(--accent)') +
      cellA(t('admLeft'), st.founder_left) +
      cellA(t('admChecks'), st.checks) +
      cellA(t('admReports'), st.reports) +
      cellA(t('admLic7'), (st.lic_used||0)+'/'+(st.lic_total||0));
  }).catch(e=>{ box.innerHTML = `<p class="col-span-3 text-[12px]" style="color:var(--accent)">${esc(String(e.message).slice(0,120))}</p>`; });

  const mailOf = ()=> ($('admMail').value||'').trim();
  const say = (html)=>{ $('admRes').innerHTML = html; };

  $('admFind').onclick = async ()=>{
    if(!mailOf()) return;
    say(t('admLoad'));
    try{
      const r = await adminRpc('rc_admin_lookup', { p_email: mailOf() });
      if (!r || !r.found) return say(`<span style="color:var(--accent)">${t('admNoUser')}</span>`);
      say(`<b>${esc(r.email)}</b><br>${t('admJoined')}: ${new Date(r.joined).toLocaleDateString(['tr-TR','en-US','de-DE'][L])}<br>
        Premium: <b style="color:${r.pro?'var(--accent)':'var(--gray)'}">${r.pro?(t('planPro')+(r.seat?' · #'+r.seat:'')):t('planFree')}</b>`);
    }catch(e){ say(`<span style="color:var(--accent)">${esc(String(e.message).slice(0,120))}</span>`); }
  };
  $('admGrant').onclick = async ()=>{
    if(!mailOf()) return;
    try{ const r = await adminRpc('rc_admin_grant_pro', { p_email: mailOf() });
      say(r && r.ok ? `<span>${t('admDone')}${r.seat?' · #'+r.seat:''}</span>`
                    : `<span style="color:var(--accent)">${t('admNoUser')}</span>`);
      bindAdmin();
    }catch(e){ say(`<span style="color:var(--accent)">${esc(String(e.message).slice(0,120))}</span>`); }
  };
  $('admRevoke').onclick = async ()=>{
    if(!mailOf()) return;
    if(!(await askConfirm(t('admRevokeAsk')))) return;
    try{ const r = await adminRpc('rc_admin_revoke_pro', { p_email: mailOf() });
      say(r && r.ok ? t('admDone') : `<span style="color:var(--accent)">${t('admNoUser')}</span>`);
      bindAdmin();
    }catch(e){ say(`<span style="color:var(--accent)">${esc(String(e.message).slice(0,120))}</span>`); }
  };
  $('admLic').onclick = async ()=>{
    try{
      const codes = await adminRpc('rc_admin_new_licenses', { p_count: 10, p_note: 'panel' });
      const list = Array.isArray(codes) ? codes.join('\n') : String(codes);
      openModal(`<h3 class="text-lg font-bold">${t('admLic')}</h3>
        <textarea rows="6" class="field w-full rounded-xl px-3 py-2.5 text-[12.5px] num mt-3">${esc(list)}</textarea>
        <button id="lcCp" class="w-full mt-3 rounded-2xl py-3 font-bold text-[13.5px] bg-ok text-ink">${t('copyList')}</button>
        <button id="lcNo2" class="w-full mt-2 rounded-2xl py-3 font-bold text-[13px] text-slate-400">${t('mdCancel')}</button>`);
      $('lcCp').onclick = ()=>copy(list);
      $('lcNo2').onclick = closeModal;
    }catch(e){ toast(String(e.message).slice(0,90)); }
  };
}

      f.type = sh?'text':'password'; $('rsEye').textContent = sh?t('mdHidePw'):t('mdShowPw'); };

    $('rsGo').onclick = async ()=>{
      const mail = $('rsE').value.trim();
      $('rsErr').classList.add('hidden'); $('rsOk').classList.add('hidden');
      if(!mail){ $('rsErr').textContent = t('mdNeedMail'); $('rsErr').classList.remove('hidden'); return; }
      m.email = mail; $('rsGo').textContent = '...';
      try{
        const back = location.origin + location.pathname;
        const res = await fetch(CFG.url + '/auth/v1/recover?redirect_to=' + encodeURIComponent(back), {
          method:'POST', headers:{ apikey:CFG.key, 'Content-Type':'application/json' },
          body: JSON.stringify({ email: mail }) });
        if(!res.ok) throw new Error((await res.json()).msg || 'error');
        $('rsOk').classList.remove('hidden');
      }catch(e){ $('rsErr').textContent = String(e.message).slice(0,110); $('rsErr').classList.remove('hidden'); }
      $('rsGo').textContent = t('mdSendCode');
    };

    $('rsSave').onclick = async ()=>{
      const raw = $('rsC').value.trim(), pw = $('rsP').value;
      $('rsErr2').classList.add('hidden');
      if (pw.length < 6){ $('rsErr2').textContent = t('mdPwShort'); $('rsErr2').classList.remove('hidden'); return; }
      if (!raw){ $('rsErr2').textContent = t('mdBadCode'); $('rsErr2').classList.remove('hidden'); return; }
      $('rsSave').textContent = '...';
      try{
        const tok = await recoveryToken(raw, m.email || $('rsE').value.trim());
        const res = await fetch(CFG.url + '/auth/v1/user', { method:'PUT',
          headers:{ apikey:CFG.key, Authorization:'Bearer '+tok, 'Content-Type':'application/json' },
          body: JSON.stringify({ password: pw }) });
        if(!res.ok) throw new Error((await res.json()).msg || 'error');
        m.token = tok; m.recovery = false; m.view='login';
        toast(t('mdPwDone')); await modRefresh(); return;
      }catch(e){
        const msg = String(e.message);
        $('rsErr2').textContent = /expired|invalid|otp|token/i.test(msg) ? t('mdBadCode') : msg.slice(0,110);
        $('rsErr2').classList.remove('hidden');
      }
      $('rsSave').textContent = t('mdSavePw');
    };

    bar(`<button id="mdOut" class="w-full rounded-2xl py-4 font-bold text-[15px] bg-white/8 border border-white/10">${t('gBack')}</button>`);

/* Metni verilen genişliğe göre satırlara böler */
function wrapText(ctx, text, maxW, maxLines){
  const words = String(text||'').split(/\s+/);
  const lines = []; let line = '';
  for (let i=0;i<words.length;i++){
    const test = line ? line+' '+words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line){
      lines.push(line); line = words[i];
      if (maxLines && lines.length === maxLines){ line=''; break; }
    } else line = test;
  }
  if (line) lines.push(line);
  if (maxLines && lines.length > maxLines){
    lines.length = maxLines;
    lines[maxLines-1] = lines[maxLines-1].replace(/\s+\S*$/,'') + '…';
  }
  return lines;
}

const MARK_PATH = "M5.84 0.64 L58.94 0.64 L63.72 1.11 L68.14 2.20 L74.88 5.54 L78.95 8.69 L83.24 13.72 L86.58 20.07 L88.59 29.47 L87.51 39.41 L83.81 47.69 L77.62 54.81 L70.48 59.26 L63.12 61.41 L51.60 62.19 L74.39 99.19 L55.11 99.19 L38.78 74.06 L38.24 99.13 L21.54 99.13 L21.54 66.97 L22.24 66.27 L33.30 66.27 L31.72 62.76 L30.42 61.79 L17.87 61.79 L16.97 62.41 L16.49 99.13 L0.11 99.13 L0.11 45.30 L0.95 44.55 L21.24 44.55 L21.73 22.30 L38.28 22.30 L38.28 43.73 L39.00 44.42 L62.06 44.42 L65.94 42.18 L68.31 39.98 L70.61 35.82 L71.48 31.94 L70.97 27.51 L68.98 23.22 L66.19 20.32 L62.25 18.17 L58.94 17.40 L20.53 17.40 L5.73 0.79Z M0.41 2.23 L16.55 19.77 L16.55 39.86 L0.23 39.86 L0.23 2.25Z M75.88 61.73 L98.83 96.80 L99.62 99.17 L80.17 99.17 L59.83 66.97 L68.71 64.91 L75.77 61.76Z";
function drawMark(x, ox, oy, size, red){
  const u = size/100;
  x.save(); x.translate(ox, oy); x.scale(u, u);
  try{
    const p = new Path2D(MARK_PATH);
    x.fillStyle = red; x.fill(p, "evenodd");
  }catch(e){ x.fillStyle = red; x.fillRect(0,0,100,100); }
  x.restore();
}

async function makeCard(){
  const r = state.result, v = verdict(), p = PT[state.pt];
  const W = 1080, H = 1350, M = 84;
  const RED = '#FF3000', BLACK = '#000000', WHITE = '#FFFFFF', GRAY = '#767676';
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  try{ if (document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}

  const F = (size, weight)=> weight+' '+size+'px Inter, Helvetica, Arial, sans-serif';
  const LS = v => { try{ x.letterSpacing = v; }catch(e){} };
  x.fillStyle = WHITE; x.fillRect(0,0,W,H);
  x.textBaseline = 'top';

  /* --- künye --- */
  drawMark(x, M, M, 46, RED);
  x.fillStyle = BLACK; x.font = F(38, 900);
  x.fillText('RELIA', M+64, M+4);
  x.fillStyle = GRAY; x.font = F(22, 700);
  x.fillText(new Date().toLocaleDateString(['tr-TR','en-US','de-DE'][L]), W-M-x.measureText(new Date().toLocaleDateString(['tr-TR','en-US','de-DE'][L])).width, M+14);
  x.fillStyle = BLACK; x.fillRect(M, M+72, W-2*M, 6);

  /* --- skor --- */
  let y = M + 128;
  x.fillStyle = RED; x.font = F(24, 700);
  const lbl = t('score').toUpperCase();
  LS('4px'); x.fillText(lbl, M, y); LS('0px');

  y += 44;
  const scoreTxt = (r.score===null?'—':String(r.score));
  const bigSize = scoreTxt.length>2 ? 250 : 300;
  const baseY = y + bigSize*0.78;                 // ortak taban çizgisi
  x.textBaseline = 'alphabetic';
  x.fillStyle = BLACK; x.font = F(bigSize, 900);
  LS('-8px'); x.fillText(scoreTxt, M-8, baseY); LS('0px');
  const sw = x.measureText(scoreTxt).width;
  x.fillStyle = GRAY; x.font = F(52, 700);
  x.fillText('/100', M-8+sw+28, baseY);
  x.textBaseline = 'top';

  /* --- karar şeridi --- */
  y += 300;
  const isOk = v.k==='ok';
  x.fillStyle = isOk ? BLACK : RED;
  x.fillRect(M, y, W-2*M, 92);
  x.fillStyle = WHITE; x.font = F(34, 900);
  LS('2px');
  const vt = v.t.toUpperCase();
  const vtLines = wrapText(x, vt, W-2*M-56, 1);
  x.fillText(vtLines[0], M+28, y+28);
  LS('0px');

  /* --- araç --- */
  y += 124;
  x.fillStyle = BLACK; x.font = F(40, 900);
  wrapText(x, (state.brand+' '+state.model+(state.year?' · '+state.year:'')).toUpperCase(), W-2*M, 1)
    .forEach(l=>{ x.fillText(l, M, y); });
  y += 52;
  x.fillStyle = GRAY; x.font = F(26, 500);
  wrapText(x, (pick(p.n)) + '  ·  ' + fmtN(state.dist) + ' ' + unit(), W-2*M, 2)
    .forEach((l,i)=>{ x.fillText(l, M, y + i*34); });

  /* --- bulgular --- */
  y += 96;
  x.fillStyle = BLACK; x.fillRect(M, y, W-2*M, 3);
  y += 30;
  x.fillStyle = RED; x.font = F(22, 700); LS('4px');
  x.fillText(t('cardFlags').toUpperCase(), M, y); LS('0px');
  y += 46;

  const top = (r.flags||[]).filter(f=>f.lvl!=='info').slice(0,3);
  if (!top.length){
    x.fillStyle = BLACK; x.font = F(30, 700);
    x.fillText(t('cardNone'), M, y);
  } else {
    top.forEach(f=>{
      const crit = f.lvl==='crit';
      x.fillStyle = crit ? RED : BLACK;
      x.fillRect(M, y+6, 18, 18);
      x.fillStyle = BLACK; x.font = F(31, 700);
      const ls = wrapText(x, f.t, W-2*M-44, 2);
      ls.forEach((l,i)=> x.fillText(l, M+40, y + i*40));
      y += ls.length*40 + 22;
    });
  }

  /* --- alt künye --- */
  x.fillStyle = BLACK; x.fillRect(M, H-M-92, W-2*M, 3);
  x.fillStyle = GRAY; x.font = F(24, 500);
  x.fillText(t('cardFooter'), M, H-M-64);
  x.fillStyle = RED; x.font = F(26, 900);
  const by = 'RELIA';
  x.fillText(by, W-M-x.measureText(by).width, H-M-64);

  return await new Promise(res=>c.toBlob(res, 'image/png', 0.92));
}

  const flags = (r.flags||[]).filter(f=>f.lvl!=='info');
  let shop = [];
  try{ shop = shopList().slice(0,10); }catch(e){}
  const secKeys = Object.keys(SEC).filter(k=>r.secs[k]!==null);
  let H = 660 + secKeys.length*92 + 120 + flags.length*150 + 120 + shop.length*62 + 140;
  c.width = W; c.height = H;

  x.fillStyle = WHITE; x.fillRect(0,0,W,H);
  x.textBaseline = 'top';
  let y = M;

  drawMark(x, M, y, 44, RED);
  x.fillStyle = BLACK; x.font = F(34,900); x.fillText('RELIA', M+60, y+4);
  const dt = new Date().toLocaleDateString(['tr-TR','en-US','de-DE'][L]);
  x.fillStyle = GRAY; x.font = F(20,700);
  x.fillText(dt, W-M-x.measureText(dt).width, y+12);
  y += 62; x.fillStyle = BLACK; x.fillRect(M, y, W-2*M, 5); y += 40;

  x.fillStyle = RED; x.font = F(20,700); x.fillText(t('score').toUpperCase(), M, y); y += 30;
  const isOk = v.k === 'ok';
  x.textBaseline = 'alphabetic';
  x.fillStyle = isOk ? BLACK : RED; x.font = F(140,900);
  x.fillText(String(r.score), M-6, y+112);
  const sw = x.measureText(String(r.score)).width;
  x.fillStyle = GRAY; x.font = F(32,700); x.fillText('/100', M-6+sw+16, y+112);
  x.textBaseline = 'top';
  x.fillStyle = isOk ? BLACK : RED; x.fillRect(M+sw+130, y+26, W-M-(M+sw+130), 60);
  x.fillStyle = WHITE; x.font = F(23,900);
  x.fillText(wrapText(x, v.t.toUpperCase(), W-M-(M+sw+150), 1)[0], M+sw+146, y+44);
  y += 150;

  x.fillStyle = BLACK; x.font = F(30,900);
  x.fillText(wrapText(x,(state.brand+' '+state.model+(state.year?' \u00b7 '+state.year:'')).toUpperCase(),W-2*M,1)[0], M, y);
  y += 40;
  x.fillStyle = GRAY; x.font = F(21,500);
  wrapText(x, pick(p.n)+'  \u00b7  '+fmtN(state.dist)+' '+unit()+(state.price?'  \u00b7  '+fmtN(state.price):''), W-2*M, 2)
    .forEach((l,i)=>x.fillText(l, M, y+i*28));
  y += 78;

  x.fillStyle = BLACK; x.fillRect(M, y, W-2*M, 3); y += 24;
  x.fillStyle = RED; x.font = F(19,700); x.fillText(t('breakdown').toUpperCase(), M, y); y += 34;
  secKeys.forEach(k=>{
    const val = Math.round(r.secs[k]), col = val>=85 ? BLACK : RED;
    x.fillStyle = BLACK; x.font = F(23,700); x.fillText(t(SEC[k].n), M, y);
    x.fillStyle = col; x.font = F(23,900);
    const st = val+'/100'; x.fillText(st, W-M-x.measureText(st).width, y);
    x.fillStyle = SOFT; x.fillRect(M, y+34, W-2*M, 14);
    x.fillStyle = col; x.globalAlpha = (val>=65&&val<85) ? .35 : 1;
    x.fillRect(M, y+34, (W-2*M)*val/100, 14); x.globalAlpha = 1;
    y += 92;
  });

  y += 8; x.fillStyle = BLACK; x.fillRect(M, y, W-2*M, 3); y += 24;
  x.fillStyle = RED; x.font = F(19,700); x.fillText(t('flags').toUpperCase(), M, y); y += 34;
  if (!flags.length){ x.fillStyle = BLACK; x.font = F(23,700); x.fillText(t('cardNone'), M, y); y += 50; }
  flags.forEach(f=>{
    const crit = f.lvl === 'crit';
    x.fillStyle = crit ? RED : BLACK; x.fillRect(M, y+8, 16, 16);
    x.fillStyle = BLACK; x.font = F(25,900);
    const tl = wrapText(x, f.t, W-2*M-34, 2); tl.forEach((l,i)=>x.fillText(l, M+34, y+i*32));
    let yy = y + tl.length*32 + 4;
    x.fillStyle = GRAY; x.font = F(20,400);
    const dl = wrapText(x, f.a || f.d, W-2*M-34, 2); dl.forEach((l,i)=>x.fillText(l, M+34, yy+i*26));
    y = yy + dl.length*26 + 26;
  });

  if (shop.length){
    y += 8; x.fillStyle = BLACK; x.fillRect(M, y, W-2*M, 3); y += 24;
    x.fillStyle = RED; x.font = F(19,700); x.fillText(t('shopH').toUpperCase(), M, y); y += 34;
    shop.forEach(item=>{
      x.strokeStyle = BLACK; x.lineWidth = 3; x.strokeRect(M+1, y+4, 20, 20);
      x.fillStyle = BLACK; x.font = F(21,500);
      x.fillText(wrapText(x, String(item), W-2*M-36, 1)[0], M+36, y+3);
      y += 62;
    });
  }

  y = H - M - 56;
  x.fillStyle = BLACK; x.fillRect(M, y, W-2*M, 3);
  x.fillStyle = GRAY; x.font = F(19,400);
  x.fillText(wrapText(x, t('disclaimer'), W-2*M-160, 1)[0], M, y+18);
  x.fillStyle = RED; x.font = F(21,900);
  x.fillText('RELIA', W-M-x.measureText('RELIA').width, y+18);

  return await new Promise(res=>c.toBlob(res,'image/png',0.92));
}

/* Kart önizleme + paylaşım penceresi */
function showCardBlob(blob, title, existingUrl){
  const url = existingUrl || URL.createObjectURL(blob);
  openModal(`<h3 class="text-lg font-bold">${esc(title)}</h3>
    <img src="${url}" alt="" style="width:100%;border:2px solid var(--fg);margin-top:12px;display:block">
    <p class="text-[12px] mt-3 leading-relaxed" style="border-left:4px solid var(--accent);padding-left:10px">${t('cardHold')}</p>
    <button id="cdShare" class="w-full mt-4 rounded-2xl py-3.5 font-extrabold text-[14.5px] bg-ok text-ink">${t('cardShare')}</button>
    <button id="cdLink" class="w-full mt-3 rounded-2xl py-3.5 font-bold text-[14px] bg-white/8 border border-white/10">${t('cardLink')}</button>
    <button id="cdSave" class="w-full mt-3 rounded-2xl py-3.5 font-bold text-[14px] bg-white/8 border border-white/10">${t('cardSave')}</button>
    <button id="cdText" class="w-full mt-3 rounded-2xl py-3 font-bold text-[13px] bg-white/8 border border-white/10">${t('cardText')}</button>
    <button id="cdNo" class="w-full mt-3 rounded-2xl py-3 font-bold text-[13px] text-slate-400">${t('mdCancel')}</button>`);

  $('cdNo').onclick = ()=>{ closeModal(); try{ URL.revokeObjectURL(url); }catch(e){} };
  $('cdText').onclick = ()=>{ closeModal(); shareReport(); };

  $('cdShare').onclick = async ()=>{
    const title = 'Relia — ' + state.brand + ' ' + state.model;
    const line  = title + (state.result && state.result.score!==null ? ' · ' + state.result.score + '/100' : '');
    const file  = new File([blob], 'relia.png', { type:'image/png' });

    // 1) görseli doğrudan paylaş
    try{
      if (navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:title, text:line });
        rewardShare(); return;
      }
    }catch(e){ if (e && e.name === 'AbortError') return; }

    // 2) görseli yükleyip bağlantı olarak paylaş
    $('cdShare').textContent = '...';
    let link = '';
    try{ link = await uploadCard(blob); }catch(e){}
    $('cdShare').textContent = t('cardShare');
    try{
      if (navigator.share){
        await navigator.share(link ? { title:title, text:line, url:link } : { title:title, text:line });
        rewardShare(); return;
      }
    }catch(e){ if (e && e.name === 'AbortError') return; }

    // 3) uygulama seçiciyi kendimiz açalım
    shareSheet(line, link);
  };

  $('cdSave').onclick = ()=>{
    try{
      const a = document.createElement('a');
      a.href = url; a.download = 'relia-' + (state.brand+'-'+state.model).toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.png';
      document.body.appendChild(a); a.click(); setTimeout(()=>document.body.removeChild(a), 2000);
    }catch(e){ toast(t('cardFail')); }
  };

  $('cdLink').onclick = async ()=>{
    $('cdLink').textContent = '...';
    try{
      const link = await uploadCard(blob);
      openModal(`<h3 class="text-lg font-bold">${t('pdfReady')}</h3>
        <p class="text-[12px] mt-2 leading-relaxed break-all num text-slate-400">${esc(link)}</p>
        <button id="ckOpen" class="w-full mt-4 rounded-2xl py-3.5 font-extrabold text-[14.5px] bg-ok text-ink">${t('pdfOpen')}</button>
        <button id="ckCopy" class="w-full mt-3 rounded-2xl py-3.5 font-bold text-[14px] bg-white/8 border border-white/10">${t('pdfCopyLink')}</button>
        <button id="ckNo" class="w-full mt-3 rounded-2xl py-3 font-bold text-[13px] text-slate-400">${t('mdCancel')}</button>
        <p class="text-[11.5px] text-slate-500 mt-3 leading-relaxed">${t('pdfLinkNote')}</p>`);
      $('ckOpen').onclick = ()=>{ const w=window.open(link,'_blank'); if(!w) location.href=link; };
      $('ckCopy').onclick = ()=>copy(link);
      $('ckNo').onclick   = closeModal;
    }catch(e){ toast(t('cardFail')+' · '+String(e.message).slice(0,40)); $('cdLink').textContent = t('cardLink'); }
  };
}

/* Tema: sistem / açık / koyu */
function applyTheme(){
  const pref = Store.get('theme') || 'light';   // ilk kurulumda açık tema
  const dark = pref === 'dark' ||
    (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  try{
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', dark ? '#0A0A0A' : '#FFFFFF');
  }catch(e){}
  return dark;
}
try{
  if (window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
      if ((Store.get('theme')||'system') === 'system') applyTheme();
    });
  }
}catch(e){}

function detect(){
  const nav=(navigator.language||'en').toLowerCase();
  const saved = Store.get('lang');
  const ok = CFG.langs;
  if (ok.indexOf(saved) > -1) L = saved;
  else {
    const guess = nav.startsWith('tr') ? 0 : nav.startsWith('de') ? 2 : 1;
    L = ok.indexOf(guess) > -1 ? guess : (ok.indexOf(1) > -1 ? 1 : ok[0]);
  }
  let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){}
  if (nav.startsWith('tr') || tz.indexOf('Istanbul')>-1) REGION='TR';
  else if (tz.indexOf('America')>-1) REGION='US';
  else REGION='EU';
  document.documentElement.lang = ['tr','en','de'][L];
  $('langBtn').textContent = LANGS[L];
}

  L = i; Store.set('lang', i);
  $('langBtn').textContent = LANGS[L];
  document.documentElement.lang = ['tr','en','de'][L];
  if (state.result) buildResult();   // bayrak metinleri yeni dilde yeniden üretilir
  goto(SCREEN);
}

/* Metinden hazır oturum anahtarını (JWT) çıkarır */
function tokenFromLink(txt){
  const v = (txt||'').trim();
  if (!v) return '';
  const m = v.match(/access_token=(ey[A-Za-z0-9._-]+)/);
  if (m) return m[1];
  if (/^ey[A-Za-z0-9._-]+\.[A-Za-z0-9._-]+\.[A-Za-z0-9._-]+$/.test(v)) return v;
  return '';
}
/* Doğrulama kodu / bağlantı / JWT → kullanılabilir oturum anahtarı */
async function recoveryToken(raw, email){
  const v = (raw||'').trim();
  const jwt = tokenFromLink(v);
  if (jwt) return jwt;                                    // bağlantıdaki hazır anahtar

  let body;
  const hash = v.match(/[?&#]token(?:_hash)?=([A-Za-z0-9._%-]+)/);
  if (hash) body = { type:'recovery', token_hash: decodeURIComponent(hash[1]) };
  else if (/^[0-9]{6}$/.test(v)) body = { type:'recovery', token: v, email: email };
  else body = { type:'recovery', token_hash: v };

  const res = await fetch(CFG.url + '/auth/v1/verify', { method:'POST',
    headers:{ apikey:CFG.key, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  const j = await res.json();
  if (!res.ok || !j.access_token) throw new Error(j.msg || j.error_description || 'invalid_code');
  return j.access_token;
}

/* E-postadaki sıfırlama bağlantısı: hem bu sayfanın hem de kapsayan sayfanın adresine bak
   (uygulama bir çerçeve içinde çalıştığında anahtar dış sayfaya düşer) */
(function(){
  const parts = [location.hash||'', location.search||''];
  try{ if (window.top !== window.self){ parts.push(window.top.location.hash||''); parts.push(window.top.location.search||''); } }catch(e){}
  const hay = parts.join('&');
  if (hay.indexOf('type=recovery') === -1 && hay.indexOf('access_token') === -1) return;
  const tok = tokenFromLink(hay);
  if (!tok) return;
  DEV = true;
  state.mod.token = tok; state.mod.recovery = true;
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  try{ if (window.top !== window.self) window.top.history.replaceState(null,'',window.top.location.pathname); }catch(e){}
  setTimeout(()=>goto('mod'), 60);
})();

/* Yönetim ve geliştirici araçları yalnızca gizli adresle açılır:
   ailaa.io/relia/?panel=1   → moderasyon paneli
   ailaa.io/relia/?diag=1    → bağlantı testi
   Arayüzde hiçbir giriş noktası yoktur. Asıl koruma sunucudaki yetki denetimidir. */
/* Yönetim adresleri. Sayfa açıkken adres değişirse (yalnızca # değişimi
   tarayıcıyı yeniden yüklemez) yine yakalanır. */
function routeAdmin(){
  const q = (location.search || '') + (location.hash || '');
  if (/[?&#]diag=1/.test(q)){ DEV = true; if (SCREEN !== 'mod') openDiag(); return true; }
  if (/[?&#]panel=1/.test(q)){
    DEV = true; PANEL_MODE = true;
    if (SCREEN !== 'mod') goto('mod');
    return true;
  }
  return false;
}
window.addEventListener('hashchange', routeAdmin);
window.addEventListener('popstate', routeAdmin);
setTimeout(routeAdmin, 60);
try{ const g = Store.get('garage');
  if (Array.isArray(g)) state.garage = g.filter((x,i,a)=>{
    if(!x.key) x.key = (x.brand||'')+'|'+(x.model||'')+'|'+(x.pt||'')+'|'+(x.dist||0);
    return a.findIndex(y=>y.key===x.key) === i;      // eski tekrarları temizle
  });
}catch(e){}
if (Store.get('fnName')) CFG.fn = Store.get('fnName');
window.addEventListener('error', e=>{
  try{ toast('Hata: ' + String(e.message||'').slice(0,60)); }catch(x){}
});
window.addEventListener('unhandledrejection', e=>{
  try{ toast('Hata: ' + String((e.reason&&e.reason.message)||e.reason||'').slice(0,60)); }catch(x){}
});

document.addEventListener('visibilitychange', ()=>{ if(document.hidden && !state.done) saveSession(); });
window.addEventListener('pagehide', saveSession);

loadUser();
applyTheme();
detect();
updateGarageBadge();
claimReferral();
collectReferrals();
(async()=>{
  if (isPro()) return;
  const n = await founderLeft();
  if (n && n > 0){ state.foundLeft = n; if (SCREEN === 'welcome') renderWelcome(); }
  if (isSignedIn()){ const f = await claimFounder(); if (f && f.seat && SCREEN==='welcome') renderWelcome(); }
})();
if (!restoreSession()) goto('welcome');
swapIcons();
setTimeout(()=>{ const sp=$('splash'); if(sp) sp.classList.add('gone'); }, 900);
registerSW();
(async()=>{ try{ await handleShared(); }catch(e){} })();
</script>
