<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>RustCheck</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RustCheck">
<style>
  html,body{height:100%;margin:0;background:#0f1115;color:#e8ecf2;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;}
  .ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#5ac8fa;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .t{font-size:14px;color:#9aa4b2;line-height:1.7;max-width:34ch;}
  .b{margin-top:6px;font:600 13px/1 system-ui;background:#2b6cb0;color:#fff;border:none;
     border-radius:9px;padding:12px 20px;cursor:pointer;}
  .b.alt{background:transparent;color:#9aa4b2;border:1px solid rgba(255,255,255,.18);}
  .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;}
  @media (prefers-reduced-motion:reduce){ .ring{animation:none} }
</style>
</head>
<body>
<div id="boot">
  <div class="ring" id="ring"></div>
  <div class="t" id="msg">RustCheck yükleniyor…</div>
  <div class="row" id="acts"></div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   RustCheck başlatıcı

   Bu dosya uygulamanın kendisi DEĞİL. Görevi: Ailaa'ya en son
   yüklediğin sürümü bulup burada, ailaa.io/rustcheck/ adresinde
   açmak. Böylece uygulamayı site içinden (Projelerim > Yeni sürüm)
   güncelleyebilirsin; bu dosyaya bir daha dokunman gerekmez.

   Uygulama üst seviye bir sayfa olarak çalışır (çerçeve yok), yani
   localStorage, pano, paylaşım, indirme, yazdırma ve PWA kurulumu
   kısıtsız çalışır. İkonlar / sw.js / manifest bu klasörden gelir.
   ───────────────────────────────────────────────────────────── */

(function(){
  var SLUG_HINTS = ["rustcheck", "rust-check"];   // proje adı ne olursa olsun yakalar
  var msg = document.getElementById("msg");
  var acts = document.getElementById("acts");
  var ring = document.getElementById("ring");

  function nk(x){ return String(x||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
  function fail(text, retry){
    ring.style.display="none";
    msg.textContent = text;
    acts.innerHTML = "";
    if(retry){
      var b=document.createElement("button"); b.className="b"; b.textContent="Tekrar dene";
      b.onclick=function(){ location.reload(); }; acts.appendChild(b);
    }
    var a=document.createElement("button"); a.className="b alt"; a.textContent="Mağazaya dön";
    a.onclick=function(){ location.href="/store"; }; acts.appendChild(a);
  }

  var url = window.AILAA_SUPABASE_URL, key = window.AILAA_SUPABASE_KEY;
  if(!url || String(url).indexOf("BURAYA") >= 0 || typeof supabase === "undefined"){
    fail("Bağlantı ayarları okunamadı.", true); return;
  }
  var db = supabase.createClient(url, key);

  db.from("projects")
    .select("id,title,slug,file_url,status,version,updated_at")
    .eq("status","approved").limit(200)
    .then(function(res){
      var rows = (res && res.data) || [];
      var hit = null;
      for(var i=0; i<rows.length && !hit; i++){
        var cand = [rows[i].slug, rows[i].title];
        for(var c=0; c<cand.length; c++){
          var n = nk(cand[c]); if(!n) continue;
          var n2 = n.replace(/\d+$/,"");
          for(var h=0; h<SLUG_HINTS.length; h++){
            if(n === SLUG_HINTS[h] || n2 === SLUG_HINTS[h]){ hit = rows[i]; break; }
          }
          if(hit) break;
        }
      }
      if(!hit || !hit.file_url){
        fail("RustCheck henüz mağazada yayında değil. Projeni yükleyip onayladıktan sonra burası çalışacak.", true);
        return;
      }

      msg.textContent = "Sürüm v" + (hit.version || 1) + " açılıyor…";

      /* Uygulamanın HTML'ini al ve BU sayfaya yerleştir.
         Adres ailaa.io/rustcheck/ olarak kalır; göreli dosyalar
         (icon-192.png, sw.js, manifest.webmanifest) bu klasörden çözülür. */
      fetch(hit.file_url, { cache: "no-store" })
        .then(function(r){
          if(!r.ok) throw new Error("http " + r.status);
          return r.text();
        })
        .then(function(html){
          if(!/<html[\s>]/i.test(html) && !/<!DOCTYPE/i.test(html)){
            throw new Error("beklenmeyen içerik");
          }
          /* aynı klasörden çözülsün diye <base> EKLEMİYORUZ — böylece
             sw.js ve manifest ailaa.io/rustcheck/ altında kalır. */
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function(){
          fail("Uygulama dosyası yüklenemedi. Bağlantını kontrol edip tekrar dene.", true);
        });
    })
    .catch(function(){
      fail("Mağazaya bağlanılamadı. Tekrar dene.", true);
    });
})();
</script>
</body>
</html>
