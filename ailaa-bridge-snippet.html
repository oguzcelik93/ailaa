<!-- =========================================================================
     AILAA ↔ WRENCH EMPIRE köprüsü
     Oyunu iframe ile açan sayfaya ekle. İki iş yapar:
       1) Site üyesini oyuna otomatik giriş yaptırır (SSO)
       2) Oyunun kaydını SİTENİN kendi deposunda tutar — böylece tarayıcı
          iframe verisini silse bile "Devam Et" ve "Beni hatırla" kaybolmaz.
     ========================================================================= -->

<iframe id="weFrame" src="/games/wrench-empire.html"
        style="width:100%;height:100%;border:0" allow="autoplay"></iframe>

<script type="module">
  // import { supabase } from '/js/supabase.js'   ← kendi yolunu koy
  const frame = document.getElementById('weFrame');
  const PFX = 'we:';                       // sitede bu önekle saklanır

  function dump() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(PFX)) data[k.slice(PFX.length)] = localStorage.getItem(k);
    }
    return data;
  }

  window.addEventListener('message', (ev) => {
    if (ev.source !== frame.contentWindow) return;      // sadece oyundan gelen
    const d = ev.data || {};
    if (d.type === 'we-store-req')
      frame.contentWindow.postMessage({ type: 'we-store-data', data: dump() }, '*');
    else if (d.type === 'we-store-set')
      localStorage.setItem(PFX + d.key, d.value);
    else if (d.type === 'we-store-del')
      localStorage.removeItem(PFX + d.key);
  });

  // --- site üyeliğiyle otomatik giriş ---
  async function handOff() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    frame.contentWindow.postMessage({
      type: 'ailaa-auth',
      access_token:  session.access_token,
      refresh_token: session.refresh_token,
      email:         session.user?.email || null
    }, '*');
  }
  frame.addEventListener('load', () => { 
    frame.contentWindow.postMessage({ type: 'we-store-data', data: dump() }, '*');
    handOff();
  });
  supabase.auth.onAuthStateChange(() => handOff());
</script>
